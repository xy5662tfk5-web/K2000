name: macOS AU build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-au:
    # Intel runner produces an x86_64 AU. Use Xcode 15.4 SDK to avoid macOS 15 API removals in JUCE 7
    # while keeping an Intel x86_64 runner to avoid libc++ symbols unavailable on macOS Monterey.
    runs-on: macos-15-intel
    steps:
      - name: Check out K2000
        uses: actions/checkout@v4

      - name: Check out JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 7.0.12
          path: JUCE

      - name: Select older Xcode toolchain
        run: |
          sudo xcode-select --switch /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DCMAKE_OSX_ARCHITECTURES=x86_64

      - name: Build Audio Unit
        run: cmake --build build --config Release --target K2000_AU --parallel 3

      - name: Ad-hoc sign Audio Unit
        run: |
          codesign --force --deep --sign - "build/K2000_artefacts/Release/AU/K2000.component"
          codesign --verify --deep --strict --verbose=2 "build/K2000_artefacts/Release/AU/K2000.component"

      - name: Verify AU bundle
        run: |
          test -d "build/K2000_artefacts/Release/AU/K2000.component"
          file "build/K2000_artefacts/Release/AU/K2000.component/Contents/MacOS/K2000"
          if nm -u "build/K2000_artefacts/Release/AU/K2000.component/Contents/MacOS/K2000" | grep -q '__from_native_exception_pointer'; then
            echo "ERROR: binary still references a libc++ symbol unavailable on Monterey"
            exit 1
          fi
          plutil -lint "build/K2000_artefacts/Release/AU/K2000.component/Contents/Info.plist"

      - name: Validate AU with Apple's Audio Unit validator
        run: |
          set -o pipefail
          sudo mkdir -p "/Library/Audio/Plug-Ins/Components"
          sudo ditto "build/K2000_artefacts/Release/AU/K2000.component" "/Library/Audio/Plug-Ins/Components/K2000.component"
          sudo xattr -dr com.apple.quarantine "/Library/Audio/Plug-Ins/Components/K2000.component" || true
          killall -9 AudioComponentRegistrar || true
          sleep 3
          /usr/bin/auval -a | tee au-components.log
          grep -F "K2Au" au-components.log
          /usr/bin/auval -v aumu K2Au K2Lb | tee auval-validation.log
          grep -q "PASS" auval-validation.log

      - name: Package AU bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent "build/K2000_artefacts/Release/AU/K2000.component" "K2000-AU-macOS-Intel.zip"
          unzip -l "K2000-AU-macOS-Intel.zip"

      - name: Upload AU artifact
        uses: actions/upload-artifact@v4
        with:
          name: K2000-AU-macOS-Intel
          path: K2000-AU-macOS-Intel.zip
          if-no-files-found: error
