name: macOS AU build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-au:
    # Intel runner produces an x86_64 AU for the user's Intel Mac.
    runs-on: macos-15-intel
    steps:
      - name: Check out K2000
        uses: actions/checkout@v4

      - name: Check out JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.6
          path: JUCE

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Audio Unit
        run: cmake --build build --config Release --target K2000_AU --parallel 3

      - name: Ad-hoc sign Audio Unit
        run: |
          codesign --force --deep --sign - "build/K2000_artefacts/Release/AU/K2000.component"
          codesign --verify --deep --strict --verbose=2 "build/K2000_artefacts/Release/AU/K2000.component"

      - name: Verify AU bundle
        run: |
          test -d "build/K2000_artefacts/Release/AU/K2000.component"
          file "build/K2000_artefacts/Release/AU/K2000.component/Contents/MacOS/K2000"
          plutil -lint "build/K2000_artefacts/Release/AU/K2000.component/Contents/Info.plist"

      - name: Package AU bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent "build/K2000_artefacts/Release/AU/K2000.component" "K2000-AU-macOS-Intel.zip"
          unzip -l "K2000-AU-macOS-Intel.zip"

      - name: Upload AU artifact
        uses: actions/upload-artifact@v4
        with:
          name: K2000-AU-macOS-Intel
          path: K2000-AU-macOS-Intel.zip
          if-no-files-found: error
